name: Build and Upload APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          packages: 'platforms;android-36 build-tools;36.0.0 platforms;android-30 extras;android;m2repository'
          accept-android-sdk-licenses: true

      - name: Build APK with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK found!"
            ls -la app/build/outputs/apk/debug/app-debug.apk
          else
            echo "APK not found, listing all outputs:"
            find app/build/outputs -type f
            exit 1
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: Camembert v1.0.${{ github.run_number }}
          body: |
            Automated build from GitHub Actions
            - Target: Android 16 (API 36)
            - Build type: Debug
            - Optimized for Samsung Galaxy S26
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/debug/app-debug.apk
          asset_name: camembert-v1.0.${{ github.run_number }}-debug.apk
          asset_content_type: application/vnd.android.package-archive
