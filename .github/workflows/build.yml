name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: '11.0'
          api-level: '37'
          build-tools: '37.0.0'
          ndk: 'false'
          cmake: 'false'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "platforms;android-30" "extras;android;m2repository" || true

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          if [ "${{ github.event.inputs.build_type || 'debug' }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: List outputs
        run: ls -la app/build/outputs/apk/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camembert-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/${{ github.event.inputs.build_type || 'debug' }}/app-${{ github.event.inputs.build_type || 'debug' }}.apk
          compression-level: 0
          retention-days: 30
