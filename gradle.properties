# Gradle properties for Camembert project
# Optimized for Android 17 and Samsung Galaxy S26

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Enable configure on demand
org.gradle.configureondemand=true

# Enable build cache
org.gradle.caching=true

# Increase heap size for better performance
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Android specific optimizations
android.enableJetifier=true
android.useAndroidX=true

# Enable R8 for code shrinking
android.enableR8=true

# Enable new resource shrinker
android.enableNewResourceShrinker=true

# Kotlin compilation optimizations
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.compiler.incremental=true

# Disable animations for faster builds
android animations disabled=true

# Enable multi-dex
android.enableMultiDex=true
